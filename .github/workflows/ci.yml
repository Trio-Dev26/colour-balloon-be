name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, Prisma schema
    runs-on: ubuntu-latest
    env:
      # Never connected to: prisma.config.ts only needs a value to load.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # keep in sync with the Dockerfile base image
          cache: npm

      - name: Install dependencies
        run: npm ci

      # generated/ is gitignored, but lint and the build both need its types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:check

      - name: Build (type check)
        run: npm run build

      - name: Validate Prisma schema
        run: npx prisma validate
