services:
   db:
      image: postgres:16
      container_name: colour-balloon-db
      env_file:
         - .env
      environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
      volumes:
         - pgdata:/var/lib/postgresql/data
      ports:
         - '5432:5432'
      restart: unless-stopped

   #  api:
   #     build:
   #        context: .
   #        dockerfile: Dockerfile
   #     container_name: triosys-api
   #     env_file:
   #        - .env
   #     environment:
   #        NODE_ENV: production
   #        PORT: ${PORT}
   #        DATABASE_URL: ${DATABASE_URL}
   #     ports:
   #        - '4000:3000'
   #     depends_on:
   #        - db
   #     restart: unless-stopped

   pgadmin:
      image: dpage/pgadmin4
      container_name: colour-balloon-pgadmin
      restart: always
      env_file:
         - .env
      environment:
         PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
         PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      ports:
         - '5050:80'
      depends_on:
         - db

volumes:
   pgdata: