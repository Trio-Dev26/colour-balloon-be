services:
   db:
      image: postgres:16
      container_name: colour-balloon-db
      env_file:
         - .env
      environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
      volumes:
         - pgdata:/var/lib/postgresql/data
      ports:
         - '5432:5432'
      restart: unless-stopped

   #  api:
   #     build:
   #        context: .
   #        dockerfile: Dockerfile
   #     container_name: triosys-api
   #     env_file:
   #        - .env
   #     environment:
   #        NODE_ENV: production
   #        PORT: ${PORT}
   #        DATABASE_URL: ${DATABASE_URL}
   #     ports:
   #        - '4000:3000'
   #     depends_on:
   #        - db
   #     restart: unless-stopped

   pgadmin:
      image: dpage/pgadmin4
      container_name: colour-balloon-pgadmin
      restart: always
      env_file:
         - .env
      environment:
         PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
         PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      ports:
         - '5050:80'
      depends_on:
         - db

   minio:
      image: minio/minio:latest
      container_name: colour-balloon-minio
      command: server /data --console-address ":9001"
      environment:
         MINIO_ROOT_USER: ${MINIO_ROOT_USER}
         MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      volumes:
         - minio_data:/data
      ports:
         - '${MINIO_PORT:-9000}:9000'
         - '${MINIO_CONSOLE_PORT:-9001}:9001'
      healthcheck:
         test: ['CMD', 'mc', 'ready', 'local']
         interval: 5s
         timeout: 5s
         retries: 5
      restart: unless-stopped

   # One-shot job: creates the (private) bucket the API stores files in.
   minio-init:
      image: minio/mc:latest
      depends_on:
         minio:
            condition: service_healthy
      environment:
         MINIO_ROOT_USER: ${MINIO_ROOT_USER}
         MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
         STORAGE_BUCKET: ${STORAGE_BUCKET}
      entrypoint: >
         /bin/sh -c "
         mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
         mc mb --ignore-existing local/$$STORAGE_BUCKET
         "

volumes:
   pgdata:
   minio_data:
